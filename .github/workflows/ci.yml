name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: bash scripts/ci/run.sh "npm ci" npm ci --no-audit --no-fund

      - name: Compilar (TypeScript estricto)
        run: bash scripts/ci/run.sh "npm run build" npm run build

      - name: Pruebas automatizadas
        run: bash scripts/ci/run.sh "npm test" npm test

      - name: La versión compilada arranca
        run: |
          out=$(node dist/index.js --version)
          echo "$out"
          [ "$out" = "NebulaCodex $(node -p "require('./package.json').version")" ]
